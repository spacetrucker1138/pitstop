<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddy – OLED Face</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #111;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    gap: 32px;
  }

  .oled {
    width: 380px;
    height: 240px;
    background: #000;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 3px #1a1a1a,
      0 0 0 5px #222,
      0 0 24px 6px rgba(0,255,220,0.08);
  }

  .oled::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.22) 2px,
      rgba(0,0,0,0.22) 3px
    );
    pointer-events: none;
    z-index: 30;
    border-radius: 16px;
  }

  .oled::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      ellipse 85% 80% at 50% 50%,
      transparent 55%,
      rgba(0,0,0,0.55) 100%
    );
    pointer-events: none;
    z-index: 31;
    border-radius: 16px;
  }

  #face-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #wave-canvas {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 38px;
    width: 200px;
    height: 36px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #wave-canvas.visible { opacity: 1; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    max-width: 420px;
  }

  .btn {
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    color: #00ffdd;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 7px 15px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.12s;
  }
  .btn:hover  { background: #00ffdd11; border-color: #00ffdd44; }
  .btn.active { background: #00ffdd1a; border-color: #00ffdd88; box-shadow: 0 0 8px #00ffdd33; }
</style>
</head>
<body>

<div class="oled">
  <svg id="face-svg" viewBox="0 0 380 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="3.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="glow-soft" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <clipPath id="clip-left">
        <rect id="clip-left-rect" x="62" y="60" width="108" height="100" rx="18"/>
      </clipPath>
      <clipPath id="clip-right">
        <rect id="clip-right-rect" x="210" y="60" width="108" height="100" rx="18"/>
      </clipPath>
    </defs>

    <rect id="eye-l" x="62" y="60" width="108" height="100" rx="18" fill="#00ffdd" filter="url(#glow)"/>
    <rect id="lid-l-top" x="62" y="60" width="108" height="0" fill="#000" clip-path="url(#clip-left)"/>
    <rect id="lid-l-bot" x="62" y="160" width="108" height="0" fill="#000" clip-path="url(#clip-left)"/>

    <rect id="eye-r" x="210" y="60" width="108" height="100" rx="18" fill="#00ffdd" filter="url(#glow)"/>
    <rect id="lid-r-top" x="210" y="60" width="108" height="0" fill="#000" clip-path="url(#clip-right)"/>
    <rect id="lid-r-bot" x="210" y="160" width="108" height="0" fill="#000" clip-path="url(#clip-right)"/>

    <text id="icon-heart" x="190" y="50" text-anchor="middle" font-size="28" fill="#ff5599" filter="url(#glow-soft)" opacity="0" font-family="serif">♥</text>
    <text id="icon-zzz" x="320" y="55" text-anchor="middle" font-size="18" fill="#00ffdd" filter="url(#glow-soft)" opacity="0" font-family="monospace">Zzz</text>
    <text id="icon-exclaim" x="190" y="52" text-anchor="middle" font-size="32" fill="#ffdd00" filter="url(#glow-soft)" opacity="0" font-family="monospace" font-weight="bold">!</text>
    <text id="icon-question" x="316" y="56" text-anchor="middle" font-size="26" fill="#00ffdd" filter="url(#glow-soft)" opacity="0" font-family="monospace">?</text>

    <!-- Mad: right-angle triangles. Left: right-angle bottom-left, hypotenuse slashes down-right -->
    <polygon id="mad-eye-l" points="62,70 62,160 170,160" fill="#00ffdd" filter="url(#glow)" opacity="0"/>
    <!-- Right: right-angle bottom-right, hypotenuse slashes down-left -->
    <polygon id="mad-eye-r" points="318,70 318,160 210,160" fill="#00ffdd" filter="url(#glow)" opacity="0"/>
    <!-- Anger vein top-left -->
    <text id="icon-anger" x="42" y="46" text-anchor="middle" font-size="28" fill="#ffffff" filter="url(#glow-soft)" opacity="0" font-family="serif">✖</text>
  </svg>

  <canvas id="wave-canvas" width="200" height="36"></canvas>
</div>

<div class="controls">
  <button class="btn active" onclick="setExpr('idle',this)">Idle</button>
  <button class="btn" onclick="setExpr('happy',this)">Happy</button>
  <button class="btn" onclick="setExpr('sad',this)">Sad</button>
  <button class="btn" onclick="setExpr('mad',this)">Mad</button>
  <button class="btn" onclick="setExpr('curious',this)">Curious</button>
  <button class="btn" onclick="setExpr('sleepy',this)">Sleepy</button>
  <button class="btn" onclick="setExpr('startled',this)">Startled</button>
  <button class="btn" onclick="setExpr('talking',this)">Talking</button>
</div>

<script>
const CYN='#00ffdd';
const EYE_W=108,EYE_H=100,EYE_L_X=62,EYE_L_Y=60,EYE_R_X=210,EYE_R_Y=60;
let currentExpr='idle',blinkTimer=null,iconTimer=null,wavePhase=0,waveAmp=0,waveAmpTgt=0;
const el=id=>document.getElementById(id);

function setEyeBase(lx,ly,lw,lh,lrx,rx,ry,rw,rh,rrx){
  ['eye-l','clip-left-rect'].forEach(id=>{
    el(id).setAttribute('x',lx);el(id).setAttribute('y',ly);
    el(id).setAttribute('width',lw);el(id).setAttribute('height',lh);
    el(id).setAttribute('rx',lrx);
  });
  ['eye-r','clip-right-rect'].forEach(id=>{
    el(id).setAttribute('x',rx);el(id).setAttribute('y',ry);
    el(id).setAttribute('width',rw);el(id).setAttribute('height',rh);
    el(id).setAttribute('rx',rrx);
  });
}

function resetLids(){
  ['lid-l-top','lid-l-bot','lid-r-top','lid-r-bot'].forEach(id=>el(id).setAttribute('height','0'));
}

function setLidTop(side,h){
  const eid=side==='l'?'lid-l-top':'lid-r-top';
  const ex=side==='l'?EYE_L_X:EYE_R_X,ey=side==='l'?EYE_L_Y:EYE_R_Y;
  el(eid).setAttribute('x',ex);el(eid).setAttribute('y',ey);
  el(eid).setAttribute('width',EYE_W);el(eid).setAttribute('height',h);
}

function setLidBot(side,h){
  const eid=side==='l'?'lid-l-bot':'lid-r-bot';
  const ex=side==='l'?EYE_L_X:EYE_R_X,ey=side==='l'?EYE_L_Y:EYE_R_Y;
  el(eid).setAttribute('x',ex);el(eid).setAttribute('y',ey+EYE_H-h);
  el(eid).setAttribute('width',EYE_W);el(eid).setAttribute('height',h);
}

function hideAllIcons(){
  ['icon-heart','icon-zzz','icon-exclaim','icon-question','icon-anger',
   'mad-eye-l','mad-eye-r'].forEach(id=>el(id).setAttribute('opacity','0'));
}

function setEyeTilt(angleDeg){
  const lCx=EYE_L_X+EYE_W/2,lCy=EYE_L_Y+EYE_H/2;
  const rCx=EYE_R_X+EYE_W/2,rCy=EYE_R_Y+EYE_H/2;
  const tL=`rotate(${angleDeg},${lCx},${lCy})`;
  const tR=`rotate(${-angleDeg},${rCx},${rCy})`;
  ['eye-l','clip-left-rect','lid-l-top','lid-l-bot'].forEach(id=>el(id).setAttribute('transform',tL));
  ['eye-r','clip-right-rect','lid-r-top','lid-r-bot'].forEach(id=>el(id).setAttribute('transform',tR));
}

function resetEyeTilt(){
  ['eye-l','clip-left-rect','lid-l-top','lid-l-bot',
   'eye-r','clip-right-rect','lid-r-top','lid-r-bot'].forEach(id=>el(id).removeAttribute('transform'));
}

function showIcon(id){el(id).setAttribute('opacity','1');}

function resetEyePos(){
  setEyeBase(EYE_L_X,EYE_L_Y,EYE_W,EYE_H,18,EYE_R_X,EYE_R_Y,EYE_W,EYE_H,18);
  el('eye-l').setAttribute('opacity','1');
  el('eye-r').setAttribute('opacity','1');
}

function applyExpr(name){
  resetLids();hideAllIcons();resetEyePos();resetEyeTilt();stopBlink();
  const wave=el('wave-canvas');
  switch(name){
    case 'idle':
      startBlink(4200,0.05);waveAmpTgt=0;wave.classList.remove('visible');break;
    case 'talking':
      startBlink(5000,0.05);waveAmpTgt=13;wave.classList.add('visible');break;
    case 'happy':
      setLidBot('l',EYE_H*0.42);setLidBot('r',EYE_H*0.42);
      showIcon('icon-heart');floatIcon('icon-heart');
      startBlink(6000,0.04);waveAmpTgt=0;wave.classList.remove('visible');break;
    case 'sad':
      setEyeBase(EYE_L_X,EYE_L_Y+8,EYE_W,EYE_H-8,18,EYE_R_X,EYE_R_Y+8,EYE_W,EYE_H-8,18);
      setLidTop('l',EYE_H*0.28);setLidTop('r',EYE_H*0.28);
      startBlink(7000,0.03);waveAmpTgt=0;wave.classList.remove('visible');break;
    case 'mad':
      el('eye-l').setAttribute('opacity','0');
      el('eye-r').setAttribute('opacity','0');
      el('mad-eye-l').setAttribute('opacity','1');
      el('mad-eye-r').setAttribute('opacity','1');
      showIcon('icon-anger');
      startBlink(8000,0.03);waveAmpTgt=0;wave.classList.remove('visible');break;
    case 'curious':
      setEyeBase(EYE_L_X,EYE_L_Y+10,EYE_W*0.85,EYE_H*0.85,18,EYE_R_X-4,EYE_R_Y-6,EYE_W*1.05,EYE_H*1.1,18);
      showIcon('icon-question');
      startBlink(5500,0.04);waveAmpTgt=0;wave.classList.remove('visible');break;
    case 'sleepy':
      setLidTop('l',EYE_H*0.65);setLidTop('r',EYE_H*0.65);
      showIcon('icon-zzz');
      startBlink(9000,0.025);waveAmpTgt=0;wave.classList.remove('visible');break;
    case 'startled':
      setEyeBase(EYE_L_X-4,EYE_L_Y-12,EYE_W+8,EYE_H+20,18,EYE_R_X-4,EYE_R_Y-12,EYE_W+8,EYE_H+20,18);
      showIcon('icon-exclaim');
      startBlink(3000,0.06);waveAmpTgt=0;wave.classList.remove('visible');break;
  }
}

function stopBlink(){if(blinkTimer)clearTimeout(blinkTimer);blinkTimer=null;}
function startBlink(interval,variance){
  stopBlink();
  function schedule(){
    const j=(Math.random()-0.5)*interval*variance*2;
    blinkTimer=setTimeout(()=>{if(currentExpr!=='sleepy')doBlink();schedule();},interval+j);
  }
  schedule();
}
function doBlink(){
  const steps=[0,EYE_H*0.9,EYE_H*0.9,0],delays=[0,55,110,175];
  steps.forEach((h,i)=>setTimeout(()=>{setLidTop('l',h);setLidTop('r',h);},delays[i]));
}

function floatIcon(id){
  clearTimeout(iconTimer);let t=0;
  function tick(){
    t+=0.04;el(id).setAttribute('y',50-Math.sin(t)*6);
    if(currentExpr==='happy')iconTimer=setTimeout(tick,30);
  }
  tick();
}

const wCtx=el('wave-canvas').getContext('2d');
const WW=200,WH=36;
function drawWave(){
  wCtx.clearRect(0,0,WW,WH);
  waveAmp+=(waveAmpTgt-waveAmp)*0.1;
  wavePhase+=0.12;
  wCtx.beginPath();
  wCtx.strokeStyle=CYN;wCtx.lineWidth=2.5;
  wCtx.shadowColor=CYN;wCtx.shadowBlur=8;wCtx.lineCap='round';
  for(let i=0;i<=60;i++){
    const x=(i/60)*WW;
    const y=WH/2+Math.sin(i*0.30+wavePhase)*waveAmp+Math.sin(i*0.58+wavePhase*1.4)*(waveAmp*0.35)+Math.sin(i*0.13+wavePhase*0.6)*(waveAmp*0.2);
    i===0?wCtx.moveTo(x,y):wCtx.lineTo(x,y);
  }
  wCtx.stroke();
  wCtx.beginPath();
  wCtx.strokeStyle='rgba(0,255,221,0.18)';wCtx.lineWidth=1;wCtx.shadowBlur=3;
  for(let i=0;i<=60;i++){
    const x=(i/60)*WW;
    const y=WH/2+Math.sin(i*0.30+wavePhase+0.3)*(waveAmp*0.6)+Math.sin(i*0.58+wavePhase*1.1)*(waveAmp*0.25);
    i===0?wCtx.moveTo(x,y):wCtx.lineTo(x,y);
  }
  wCtx.stroke();
  requestAnimationFrame(drawWave);
}
drawWave();

function setExpr(name,btn){
  currentExpr=name;applyExpr(name);
  document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
applyExpr('idle');
</script>
</body>
</html>
