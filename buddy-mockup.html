<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buddy – LOOI Style CRT</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0d;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
    overflow: hidden;
  }

  .robot-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: relative;
  }

  .robot-head {
    width: 320px;
    height: 280px;
    background: linear-gradient(160deg, #1c1c1c 0%, #111 60%, #0a0a0a 100%);
    border-radius: 22px;
    border: 3px solid #2a2a2a;
    box-shadow:
      0 0 0 1px #333,
      0 6px 30px rgba(0,0,0,0.8),
      inset 0 1px 0 #3a3a3a,
      inset 0 -2px 8px rgba(0,0,0,0.5);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .antenna {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 18px;
    background: #2a2a2a;
    border-radius: 3px 3px 0 0;
  }
  .antenna::before {
    content: '';
    position: absolute;
    top: -7px; left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #00ffaa, #007744);
    box-shadow: 0 0 8px #00ff8899, 0 0 20px #00ff4444;
    animation: antennaPulse 2s ease-in-out infinite;
  }

  @keyframes antennaPulse {
    0%, 100% { opacity: 0.7; box-shadow: 0 0 6px #00ff8899, 0 0 14px #00ff4444; }
    50%       { opacity: 1;   box-shadow: 0 0 12px #00ffaacc, 0 0 28px #00ff6666; }
  }

  .rivets {
    position: absolute;
    top: 10px; left: 10px; right: 10px;
    display: flex;
    justify-content: space-between;
  }
  .rivet {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #3a3a3a, #1a1a1a);
    border: 1px solid #404040;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  .face-screen {
    width: 270px;
    height: 180px;
    background: #000;
    border-radius: 10px;
    border: 3px solid #1a1a1a;
    box-shadow:
      0 0 0 1px #0a0a0a,
      0 0 20px 4px #00ff7722,
      0 0 50px 10px #00ff4411,
      inset 0 0 40px #001a0d;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .face-screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 2px,
      rgba(0,0,0,0.25) 2px,
      rgba(0,0,0,0.25) 3px
    );
    pointer-events: none;
    z-index: 20;
  }

  .face-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 70% at 50% 40%, #001a0d 0%, #000 100%);
    z-index: 0;
  }

  .eyes-row {
    display: flex;
    gap: 22px;
    position: relative;
    z-index: 5;
  }

  .eye-box {
    width: 88px;
    height: 62px;
    border-radius: 12px;
    background: radial-gradient(ellipse 70% 60% at 45% 40%,
      #00ffbb 0%,
      #00cc77 35%,
      #006633 65%,
      #001a0d 100%
    );
    box-shadow:
      0 0 10px 3px #00ff8855,
      0 0 25px 6px #00ff4422,
      inset 0 0 12px rgba(0,255,120,0.2),
      inset 0 -4px 10px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
    transform-origin: center center;
    animation: eyeBoxBlink 5s ease-in-out infinite;
  }

  .eyes-row .eye-box:nth-child(2) {
    animation-delay: 0.08s;
  }

  @keyframes eyeBoxBlink {
    0%,  42% { transform: scaleY(1); }
    45%       { transform: scaleY(0.06); }
    48%       { transform: scaleY(1); }
    100%      { transform: scaleY(1); }
  }

  .pupil {
    position: absolute;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    background: radial-gradient(circle at 35% 30%, #1a2a1a, #000);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 6px rgba(0,200,80,0.3);
    transition: transform 0.15s ease;
  }

  .eye-glint {
    position: absolute;
    top: 9px; left: 12px;
    width: 14px; height: 9px;
    background: rgba(255,255,255,0.45);
    border-radius: 50%;
    filter: blur(1.5px);
    z-index: 2;
  }

  .mouth-area {
    position: relative;
    z-index: 5;
    width: 180px;
    height: 34px;
  }

  canvas#waveform {
    width: 100%;
    height: 100%;
    display: block;
  }

  .status-text {
    position: absolute;
    bottom: 8px;
    left: 0; right: 0;
    text-align: center;
    font-size: 9px;
    letter-spacing: 3px;
    color: #00ff6633;
    text-transform: uppercase;
    z-index: 10;
    animation: statusFlicker 3s ease-in-out infinite;
  }

  @keyframes statusFlicker {
    0%, 48%, 52%, 100% { opacity: 0.5; }
    50%                { opacity: 0.1; }
    49%, 51%           { opacity: 0.8; }
  }

  .robot-neck {
    width: 50px;
    height: 18px;
    background: linear-gradient(to bottom, #1a1a1a, #141414);
    border-left: 2px solid #252525;
    border-right: 2px solid #252525;
    border-bottom: 2px solid #222;
  }

  .robot-body {
    width: 260px;
    height: 120px;
    background: linear-gradient(160deg, #1a1a1a 0%, #111 70%, #0d0d0d 100%);
    border-radius: 14px 14px 20px 20px;
    border: 3px solid #252525;
    box-shadow:
      0 4px 20px rgba(0,0,0,0.7),
      inset 0 1px 0 #333,
      inset 0 -2px 6px rgba(0,0,0,0.5);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .chest-panel {
    width: 100px;
    height: 60px;
    border-radius: 8px;
    background: #0a0a0a;
    border: 2px solid #1f1f1f;
    box-shadow: inset 0 0 14px rgba(0,255,100,0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    padding: 6px;
  }

  .led {
    width: 10px; height: 10px;
    border-radius: 50%;
    animation: ledPulse 2s ease-in-out infinite;
  }
  .led.green  { background: #00ff77; box-shadow: 0 0 6px #00ff7799; animation-delay: 0s; }
  .led.teal   { background: #00ddff; box-shadow: 0 0 6px #00ddff99; animation-delay: 0.4s; }
  .led.yellow { background: #ffdd00; box-shadow: 0 0 6px #ffdd0099; animation-delay: 0.8s; }
  .led.orange { background: #ff8800; box-shadow: 0 0 6px #ff880099; animation-delay: 1.2s; }
  .led.red    { background: #ff3344; box-shadow: 0 0 6px #ff334499; animation-delay: 1.6s; }
  .led.purple { background: #aa44ff; box-shadow: 0 0 6px #aa44ff99; animation-delay: 0.6s; }

  @keyframes ledPulse {
    0%, 100% { opacity: 0.4; }
    50%       { opacity: 1; }
  }

  .vent { display: flex; flex-direction: column; gap: 5px; }
  .vent-line {
    width: 28px; height: 3px;
    border-radius: 2px;
    background: #1f1f1f;
    border-top: 1px solid #2a2a2a;
  }

  .controls {
    margin-top: 28px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 360px;
  }

  .btn {
    background: #111;
    border: 1px solid #2a2a2a;
    color: #00ff77;
    font-family: monospace;
    font-size: 10px;
    letter-spacing: 1px;
    padding: 7px 14px;
    border-radius: 6px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.15s;
    box-shadow: inset 0 1px 0 #2a2a2a;
  }
  .btn:hover {
    background: #00ff7711;
    border-color: #00ff7744;
    box-shadow: 0 0 8px #00ff7722, inset 0 1px 0 #2a2a2a;
  }
  .btn.active {
    background: #00ff7722;
    border-color: #00ff7766;
    box-shadow: 0 0 12px #00ff7744, inset 0 1px 0 #00ff7733;
  }
</style>
</head>
<body>

<div class="robot-wrap">
  <div class="robot-head">
    <div class="antenna"></div>
    <div class="rivets">
      <div class="rivet"></div>
      <div class="rivet"></div>
      <div class="rivet"></div>
      <div class="rivet"></div>
    </div>
    <div class="face-screen">
      <div class="eyes-row">
        <div class="eye-box" id="eyeL">
          <div class="eye-glint"></div>
          <div class="pupil" id="pupilL"></div>
        </div>
        <div class="eye-box" id="eyeR">
          <div class="eye-glint"></div>
          <div class="pupil" id="pupilR"></div>
        </div>
      </div>
      <div class="mouth-area">
        <canvas id="waveform" width="180" height="34"></canvas>
      </div>
      <div class="status-text" id="statusText">IDLE</div>
    </div>
  </div>

  <div class="robot-neck"></div>

  <div class="robot-body">
    <div class="vent">
      <div class="vent-line"></div>
      <div class="vent-line"></div>
      <div class="vent-line"></div>
      <div class="vent-line"></div>
    </div>
    <div class="chest-panel">
      <div class="led green"></div>
      <div class="led teal"></div>
      <div class="led yellow"></div>
      <div class="led orange"></div>
      <div class="led red"></div>
      <div class="led purple"></div>
    </div>
    <div class="vent">
      <div class="vent-line"></div>
      <div class="vent-line"></div>
      <div class="vent-line"></div>
      <div class="vent-line"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn active" onclick="setExpression('idle', event)">Idle</button>
    <button class="btn" onclick="setExpression('talking', event)">Talking</button>
    <button class="btn" onclick="setExpression('happy', event)">Happy</button>
    <button class="btn" onclick="setExpression('curious', event)">Curious</button>
    <button class="btn" onclick="setExpression('thinking', event)">Thinking</button>
    <button class="btn" onclick="setExpression('startled', event)">Startled</button>
    <button class="btn" onclick="setExpression('sleepy', event)">Sleepy</button>
  </div>
</div>

<script>
const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');
const W = 180, H = 34;
let expression = 'idle';
let wavePhase = 0, waveAmp = 0, waveAmpTarget = 0;

const exprData = {
  idle:     { amp: 1.5, speed: 0.035, status: 'IDLE',        eyeScaleY: 1,    eyeScaleX: 1,    hueEye: 0,   hueWave: 145, pupilOffX: 0,  pupilOffY: 0  },
  talking:  { amp: 13,  speed: 0.13,  status: 'SPEAKING',    eyeScaleY: 1,    eyeScaleX: 1,    hueEye: 15,  hueWave: 155, pupilOffX: 0,  pupilOffY: 0  },
  happy:    { amp: 7,   speed: 0.09,  status: 'HAPPY',       eyeScaleY: 1.1,  eyeScaleX: 1.1,  hueEye: 65,  hueWave: 85,  pupilOffX: 0,  pupilOffY: -4 },
  curious:  { amp: 4,   speed: 0.06,  status: 'CURIOUS',     eyeScaleY: 1.25, eyeScaleX: 0.9,  hueEye: 155, hueWave: 190, pupilOffX: 8,  pupilOffY: -6 },
  thinking: { amp: 2,   speed: 0.025, status: 'THINKING...', eyeScaleY: 0.5,  eyeScaleX: 1,    hueEye: 220, hueWave: 245, pupilOffX: -6, pupilOffY: 4  },
  startled: { amp: 17,  speed: 0.16,  status: 'STARTLED',    eyeScaleY: 1.4,  eyeScaleX: 1.3,  hueEye: -85, hueWave: 12,  pupilOffX: 0,  pupilOffY: -8 },
  sleepy:   { amp: 1,   speed: 0.015, status: 'ZZZ...',      eyeScaleY: 0.3,  eyeScaleX: 1,    hueEye: 200, hueWave: 210, pupilOffX: 0,  pupilOffY: 8  },
};

function setExpression(name, e) {
  expression = name;
  const d = exprData[name];
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  eyeL.style.transform = `scaleY(${d.eyeScaleY}) scaleX(${d.eyeScaleX})`;
  eyeR.style.transform = `scaleY(${d.eyeScaleY}) scaleX(${d.eyeScaleX})`;
  eyeL.style.filter = `hue-rotate(${d.hueEye}deg)`;
  eyeR.style.filter = `hue-rotate(${d.hueEye}deg)`;
  const pL = document.getElementById('pupilL');
  const pR = document.getElementById('pupilR');
  pL.style.transform = `translate(calc(-50% + ${d.pupilOffX}px), calc(-50% + ${d.pupilOffY}px))`;
  pR.style.transform = `translate(calc(-50% + ${d.pupilOffX}px), calc(-50% + ${d.pupilOffY}px))`;
  document.getElementById('statusText').textContent = d.status;
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  waveAmpTarget = d.amp;
}

function drawWaveform() {
  ctx.clearRect(0, 0, W, H);
  const d = exprData[expression];
  waveAmp += (waveAmpTarget - waveAmp) * 0.08;
  wavePhase += d.speed;
  const hue = d.hueWave;
  ctx.beginPath();
  ctx.strokeStyle = `hsla(${hue},100%,62%,0.92)`;
  ctx.lineWidth = 2;
  ctx.shadowColor = `hsla(${hue},100%,62%,0.7)`;
  ctx.shadowBlur = 7;
  ctx.lineCap = 'round';
  for (let i = 0; i <= 50; i++) {
    const x = (i/50)*W;
    const y = H/2 + Math.sin(i*0.30+wavePhase)*waveAmp + Math.sin(i*0.58+wavePhase*1.4)*(waveAmp*0.38) + Math.sin(i*0.14+wavePhase*0.65)*(waveAmp*0.22);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  ctx.beginPath();
  ctx.strokeStyle = `hsla(${hue},100%,72%,0.2)`;
  ctx.lineWidth = 1; ctx.shadowBlur = 3;
  for (let i = 0; i <= 50; i++) {
    const x = (i/50)*W;
    const y = H/2 + Math.sin(i*0.30+wavePhase+0.25)*(waveAmp*0.65) + Math.sin(i*0.58+wavePhase*1.1)*(waveAmp*0.28);
    i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.stroke();
  requestAnimationFrame(drawWaveform);
}

waveAmpTarget = exprData.idle.amp;
drawWaveform();

document.addEventListener('mousemove', (e) => {
  if (expression !== 'idle' && expression !== 'talking') return;
  const eyeL = document.getElementById('eyeL');
  const rect = eyeL.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const dx = (e.clientX-cx)/window.innerWidth, dy = (e.clientY-cy)/window.innerHeight;
  const ox = Math.max(-12, Math.min(12, dx*60)), oy = Math.max(-8, Math.min(8, dy*40));
  document.getElementById('pupilL').style.transform = `translate(calc(-50% + ${ox}px), calc(-50% + ${oy}px))`;
  document.getElementById('pupilR').style.transform = `translate(calc(-50% + ${ox}px), calc(-50% + ${oy}px))`;
});
</script>
</body>
</html>
