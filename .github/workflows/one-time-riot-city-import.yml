name: One-time JURN Riot City import
on:
  workflow_dispatch:
    inputs:
      game_archive_url:
        description: Temporary download URL for the user-supplied game ZIP
        required: true
        type: string
      thumbnail_archive_url:
        description: Temporary download URL for the user-supplied thumbnail ZIP
        required: true
        type: string
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch and validate uploaded archives
        env:
          GAME_ARCHIVE_URL: ${{ inputs.game_archive_url }}
          THUMB_ARCHIVE_URL: ${{ inputs.thumbnail_archive_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location "$GAME_ARCHIVE_URL" --output "$RUNNER_TEMP/jurn-riot-city-game.zip"
          curl --fail --silent --show-error --location "$THUMB_ARCHIVE_URL" --output "$RUNNER_TEMP/jurn-riot-city-thumbnails.zip"
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath
          run_temp = Path(os.environ['RUNNER_TEMP'])
          game = zipfile.ZipFile(run_temp / 'jurn-riot-city-game.zip')
          thumbs = zipfile.ZipFile(run_temp / 'jurn-riot-city-thumbnails.zip')
          names = game.namelist()
          if 'jurn-riot-city/index.html' not in names:
              raise SystemExit('Game archive does not contain the expected entry page')
          if any(PurePosixPath(n).is_absolute() or '..' in PurePosixPath(n).parts for n in names):
              raise SystemExit('Game archive contains an unsafe path')
          if 'jurn-riot-city-thumb-16x9-crop.jpg' not in thumbs.namelist():
              raise SystemExit('Thumbnail archive does not contain the selected 16:9 card art')
          PY
      - name: Extract game, place art, and update Games page
        run: |
          set -euo pipefail
          unzip -q "$RUNNER_TEMP/jurn-riot-city-game.zip" -d "$RUNNER_TEMP/riot-game"
          unzip -q "$RUNNER_TEMP/jurn-riot-city-thumbnails.zip" -d "$RUNNER_TEMP/riot-thumbs"
          test ! -e games/jurn-riot-city
          mkdir -p games
          cp -a "$RUNNER_TEMP/riot-game/jurn-riot-city" games/jurn-riot-city
          cp "$RUNNER_TEMP/riot-thumbs/jurn-riot-city-thumb-16x9-crop.jpg" games/jurn-riot-city/website-thumb.jpg
          python3 - <<'PY'
          from pathlib import Path
          page = Path('games.html')
          text = page.read_text(encoding='utf-8')
          old_hero = '<a href="games/the-last-selfie/" class="hero fade-in" style="animation-delay:.05s"><img class="hero-img" src="games/the-last-selfie/assets/the-last-selfie-thumb.png" alt="THE LAST SELFIE"><span class="badge-new">NEW</span><div class="hero-grad"></div><div class="hero-content"><div class="hero-eyebrow">Featured Game &nbsp;·&nbsp; Timing Game</div><h1 class="hero-title">THE LAST SELFIE</h1><p class="hero-desc">Stand on live rails for the shot. A train is coming. Snap close for more points, then get off. Wait too long and it\'s splat. Six crossings, then a Trash Queen bonus. Life outranks the shot.</p><div class="hero-tags"><span class="ft">NEW SONG</span><span class="ft">Timing</span><span class="ft">Six Crossings</span><span class="ft">Trash Queen Bonus</span><span class="ft">X Share</span></div><span class="hero-btn">▶ &nbsp;Take the Shot</span></div></a>'
          new_hero = '<a href="games/jurn-riot-city/" class="hero fade-in" style="animation-delay:.05s"><img class="hero-img" src="games/jurn-riot-city/website-thumb.jpg" alt="JURN: Riot City — the JURN band faces off against the Visors"><span class="badge-new">NEW</span><div class="hero-grad"></div><div class="hero-content"><div class="hero-eyebrow">Featured Game &nbsp;·&nbsp; 2.5D Brawler</div><h1 class="hero-title">JURN: RIOT CITY</h1><p class="hero-desc">A 2.5D alley brawler. Pick Vox, Riff, Taz or Bonecrush and fight the Visors to Tarant.</p><div class="hero-tags"><span class="ft">2.5D Brawler</span><span class="ft">4 Fighters</span><span class="ft">5 Stages</span><span class="ft">Original Music</span></div><span class="hero-btn">▶ &nbsp;Fight the Visors</span></div></a>'
          if text.count(old_hero) != 1:
              raise SystemExit('Expected current Last Selfie featured hero exactly once')
          text = text.replace(old_hero, new_hero, 1)
          old_shelf = '<div class="shelf-row">\n<a href="games/boom-bang-bar/"'
          new_shelf = '<div class="shelf-row">\n<a href="games/the-last-selfie/" class="shelf-card"><div class="shelf-thumb"><img src="games/the-last-selfie/assets/the-last-selfie-thumb.png" alt="THE LAST SELFIE" loading="lazy"><span class="badge-new">NEW</span><div class="shelf-overlay"><div class="shelf-genre">Timing Game</div><div class="shelf-title">THE LAST SELFIE</div><div class="shelf-features"><span class="ft">Six Crossings</span><span class="ft">Trash Queen Bonus</span><span class="ft">X Share</span></div><span class="shelf-play">▶ Play Now</span></div></div></a>\n<a href="games/boom-bang-bar/"'
          if text.count(old_shelf) != 1:
              raise SystemExit('Expected New Arrivals shelf insertion point exactly once')
          text = text.replace(old_shelf, new_shelf, 1)
          page.write_text(text, encoding='utf-8')
          PY
          test -f games/jurn-riot-city/index.html
          test -f games/jurn-riot-city/website-thumb.jpg
          rm -f .github/workflows/one-time-riot-city-import.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add JURN Riot City game and feature it'
          git push origin main
