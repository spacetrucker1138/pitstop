<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&display=swap">
<title>Bone Stack – JURN Arcade</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: #0a0a0a;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
  font-family: 'Creepster', cursive;
}
canvas { display: block; max-width: 100vw; max-height: 100vh; object-fit: contain; touch-action: none; background: transparent; }
#overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,.8);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 10;
}
#overlay h1 {
  color: #4ae56b;
  font-size: 3.5rem;
  margin-bottom: 8px;
  text-shadow: 0 0 20px #4ae56b;}
#overlay p { color: rgba(255,255,255,.6); font-size: 1rem; margin-bottom: 24px; font-family: monospace; }
#start-btn {
  background: #4ae56b; color: #000;
  border: none; padding: 12px 28px;
  font-family: 'Creepster', cursive; font-size: 1.2rem;
  cursor: pointer;
  border-radius: 4px;
  letter-spacing: 2px;
}
#high-scores-btn {
  margin-top: 12px;
  background: transparent; color: #ddd;
  border: 1px solid #444; padding: 8px 20px;
  font-family: 'Creepster', cursive; font-size: 1rem;
  cursor: pointer;
  border-radius: 4px;
  letter-spacing: 2px;
}
.grid-wrapper {
  position: relative;
  display: inline-block;
}
#initials-overlay {
  display: none; position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 50;
  font-family: 'Creepster', cursive;
  color: #4ae56b;
}
.ib-input { background: none; border: none; border-bottom: 2px solid #4ae56b; color: #4ae56b; font-family: 'Creepster', cursive; font-size: 3rem; width: 140px; text-align: center; outline: none; letter-spacing: 10px; }
.ib-submit { margin-top: 14px; background: #4ae56b; color: #000; border: none; padding: 8px 24px; font-family: 'Creepster', cursive; font-size: 1.2rem; cursor: pointer; border-radius: 4px; }
#lb-overlay {
  display: none; position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.9);
  flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 50;
  font-family: 'Creepster', cursive;
  color: #4ae56b;
  padding: 20px;
}
#lb-overlay h1 { font-size: 2rem; margin-bottom: 16px; }
#lb-table { width: 100%; border-collapse: collapse; font-size: 1.1rem; }
#lb-table td { padding: 6px 12px; border-bottom: 1px solid #333; }
.lb-close { margin-top: 20px; background: transparent; color: #aaa; border: 1px solid #444; padding: 7px 18px; font-family: 'Creepster', cursive; font-size: 1rem; cursor: pointer; border-radius: 4px; }
</style>
</head>
<body>
<div class="grid-wrapper">
  <canvas id="gameCanvas"></canvas>
  <div id="overlay">
      <h1>BONE STACK</h1>
      <p style="margin-bottom:4px">Arrow keys or WASD</p>
      <p style="margin-bottom:16px">Up: Rotate &nbsp; Left/Right: Move &nbsp; Down: Drop</p>
      <button id="start-btn">PRESS START</button>
      <button id="high-scores-btn">HIGH SCORES</button>
  </div>
  <div id="initials-overlay">
    <p>YPUCK SCORE!</p>
    <input id="initials-input" class="ib-input" maxlength="3" placeholder="AAA" autocomplete="off" spellcheck="false" />
    <button id="ib-submit-btn" class="ib-submit">SUBMIT</button>
  </div>
  <div id="lb-overlay">
    <h1>HIGH SCORES</h1>
    <table id="lb-table"></table>
    <button class="lb-close">CLOSE</button>
  </div>
</div>
