<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0025">
<title>DEATH DRIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Courier New',monospace;color:#fff}
#bgImage{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;filter:blur(2px);z-index:0}
#stage{position:fixed;inset:0;display:flex;justify-content:center;align-items:center;z-index:1}
#stage.portrait{align-items:flex-start;padding-top:env(safe-area-inset-top)}
#racer{position:relative;overflow:hidden;background:#0d0025;box-shadow:0 0 40px rgba(200,255,0,.12);--u:4.8px}
#canvas{display:block;width:100%;height:100%}
.lime{color:#c8ff00;text-shadow:0 0 calc(var(--u)*1) #c8ff00}
/* HUD */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#hudLap{position:absolute;left:calc(var(--u)*2.2);top:calc(var(--u)*1.8);font-size:max(13px,calc(var(--u)*3.4));font-weight:bold;letter-spacing:.08em}
#hudLap small{display:block;font-size:.55em;opacity:.7;letter-spacing:.2em}
#hudTime{position:absolute;left:50%;top:calc(var(--u)*1.4);transform:translateX(-50%);text-align:center;font-size:max(18px,calc(var(--u)*5.2));font-weight:bold;letter-spacing:.06em}
#hudTime small{display:block;font-size:max(10px,calc(var(--u)*2.1));letter-spacing:.18em;color:rgba(255,255,255,.75);text-shadow:none;font-weight:normal}
#hudButtons{position:absolute;right:calc(var(--u)*1.6);top:calc(var(--u)*1.6);display:flex;gap:calc(var(--u)*1);align-items:center;pointer-events:all;z-index:60}
.hbtn{width:max(34px,calc(var(--u)*6.4));height:max(34px,calc(var(--u)*6.4));border-radius:8px;border:1px solid rgba(200,255,0,.55);background:rgba(10,0,25,.65);color:#c8ff00;font-size:max(16px,calc(var(--u)*3));display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit}
.hbtn:hover{background:rgba(200,255,0,.15)}
#volWrap{display:flex;align-items:center;background:rgba(10,0,25,.65);border:1px solid rgba(200,255,0,.35);border-radius:8px;padding:0 8px;height:max(34px,calc(var(--u)*6.4))}
#vol{width:max(70px,calc(var(--u)*14));accent-color:#c8ff00}
#flash{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-size:max(16px,calc(var(--u)*4.4));font-weight:bold;letter-spacing:.2em;white-space:nowrap;opacity:0;transition:opacity .5s;pointer-events:none;z-index:12}
#countdown{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:max(56px,calc(var(--u)*20));font-weight:900;color:#c8ff00;text-shadow:0 0 30px #c8ff00,0 0 60px #ff2bd6;pointer-events:none;z-index:40;opacity:0}
#countdown.pop{animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.85)}}
/* Overlays */
.overlay{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:50;padding:calc(var(--u)*3)}
.overlay.show{display:flex}
#titleOverlay{background:linear-gradient(rgba(5,0,15,.55),rgba(5,0,15,.82)),url(images/death_drive_title.jpg) center/cover;cursor:pointer}
#titleOverlay h1{font-size:max(30px,calc(var(--u)*11));letter-spacing:.14em;color:#c8ff00;text-shadow:0 0 18px #c8ff00,0 0 44px #ff2bd6}
.sub{color:rgba(255,255,255,.6);font-size:max(10px,calc(var(--u)*2.2));letter-spacing:.3em;margin:calc(var(--u)*.6) 0 calc(var(--u)*3)}
.press{font-size:max(14px,calc(var(--u)*3.6));letter-spacing:.15em;animation:blink 1.1s step-end infinite;margin-bottom:calc(var(--u)*2.6)}
@keyframes blink{50%{opacity:0}}
.controls{color:rgba(255,255,255,.62);font-size:max(10px,calc(var(--u)*2.1));letter-spacing:.08em;line-height:1.7;margin-bottom:calc(var(--u)*2.4)}
.controls b{color:#c8ff00}
.lbHead{color:rgba(255,255,255,.45);font-size:max(10px,calc(var(--u)*2));letter-spacing:.25em;margin-bottom:6px}
.lb-row{display:flex;justify-content:space-between;width:max(220px,calc(var(--u)*48));font-size:max(11px,calc(var(--u)*2.5));padding:2px 0}
.lb-row.gold{color:#ffd700}.lb-row.silver{color:#c0c0c0}.lb-row.bronze{color:#cd7f32}.lb-row.normal{color:rgba(255,255,255,.55)}.lb-row.highlight{color:#c8ff00;font-weight:bold}
.pb{color:#c8ff00;font-size:max(12px,calc(var(--u)*2.8));letter-spacing:.1em}
#rotateNote{display:none;margin-top:calc(var(--u)*2);color:#ff9be8;font-size:13px;letter-spacing:.08em}
#stage.portrait #rotateNote{display:block}
#endOverlay{background:rgba(5,0,15,.86)}
#endOverlay h2{font-size:max(24px,calc(var(--u)*7.5));letter-spacing:.16em;margin-bottom:calc(var(--u)*1.5)}
#endTotal{font-size:max(20px,calc(var(--u)*6));font-weight:bold;margin-bottom:4px}
#endLaps{color:rgba(255,255,255,.7);font-size:max(11px,calc(var(--u)*2.5));letter-spacing:.08em;margin-bottom:4px}
#endDelta{font-size:max(12px,calc(var(--u)*3));letter-spacing:.1em;margin-bottom:calc(var(--u)*2)}
#endDelta.good,#endGhost.good{color:#c8ff00;text-shadow:0 0 10px #c8ff00}#endDelta.bad,#endGhost.bad{color:#ff7a9c}
#endGhost{font-size:max(11px,calc(var(--u)*2.6));letter-spacing:.1em;margin-bottom:calc(var(--u)*2)}
#initialsSection{display:none;flex-direction:column;align-items:center;margin-bottom:calc(var(--u)*1.5)}
.initials-label{color:rgba(255,255,255,.65);font-size:max(10px,calc(var(--u)*2.1));letter-spacing:.15em;margin-bottom:6px}
#initialsInput{background:rgba(255,255,255,.08);border:1px solid rgba(200,255,0,.5);color:#c8ff00;font-family:inherit;font-size:22px;text-align:center;width:100px;letter-spacing:.3em;padding:4px 8px;text-transform:uppercase;outline:none;-webkit-user-select:text;user-select:text}
.btn{margin-top:8px;background:rgba(10,0,25,.6);border:1px solid rgba(200,255,0,.6);color:#c8ff00;font-family:inherit;font-size:max(13px,calc(var(--u)*2.6));letter-spacing:.12em;padding:max(8px,calc(var(--u)*1.4)) max(16px,calc(var(--u)*3.4));cursor:pointer;border-radius:6px;min-height:40px}
.btn:hover{background:rgba(200,255,0,.15)}
.btnRow{display:flex;gap:12px;margin-top:calc(var(--u)*2);flex-wrap:wrap;justify-content:center}
.hint{margin-top:10px;color:rgba(255,255,255,.4);font-size:max(10px,calc(var(--u)*1.9));letter-spacing:.15em}
/* Mobile controls */
#mob-overlay{display:none;position:fixed;inset:0;z-index:70;pointer-events:none}
body.touch #mob-overlay{display:block}
body.touch.menu #mob-overlay{display:none}
#mob-wheel-wrap{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(10px + env(safe-area-inset-bottom));width:var(--wheel,110px);height:var(--wheel,110px);pointer-events:all}
#mob-wheel-canvas{display:block;width:100%;height:100%;touch-action:none;opacity:.85}
#mob-pedals{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;pointer-events:all}
.mob-pedal{width:var(--pedw,64px);height:var(--pedh,48px);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold;letter-spacing:.05em;touch-action:none}
#mob-gas{background:rgba(0,200,80,.22);border:2px solid rgba(0,220,80,.65);color:rgba(170,255,190,.95)}
#mob-gas.pressed{background:rgba(0,200,80,.55)}
#mob-brake{background:rgba(220,30,30,.22);border:2px solid rgba(255,60,60,.55);color:rgba(255,170,170,.95)}
#mob-brake.pressed{background:rgba(220,30,30,.55)}
</style>
</head>
<body>
<img id="bgImage" src="images/death_drive_title.jpg" alt="">
<div id="stage">
 <div id="racer">
  <canvas id="canvas" width="640" height="480"></canvas>
  <div id="hud">
   <div id="hudLap" class="lime"><small>LAP</small><span id="lapVal">1/2</span></div>
   <div id="hudTime" class="lime"><span id="timeVal">0:00.0</span><small>BEST LAP <span id="bestVal">--</span></small></div>
   <div id="flash" class="lime"></div>
  </div>
  <div id="hudButtons">
   <div id="volWrap"><input id="vol" type="range" min="0" max="100" value="70" aria-label="Volume"></div>
   <button class="hbtn" id="muteBtn" aria-label="Mute">&#128266;</button>
   <button class="hbtn" id="fsBtn" aria-label="Fullscreen">&#x26F6;</button>
  </div>
  <div id="countdown"></div>
  <div id="titleOverlay" class="overlay show">
   <h1>DEATH DRIVE</h1>
   <div class="sub">A JURN ARCADE GAME</div>
   <div class="press" id="pressText">PRESS ANY KEY TO RACE</div>
   <div class="controls" id="controlsText"><b>&larr; &rarr;</b> / <b>A D</b> steer &nbsp; <b>&uarr;</b> / <b>W</b> gas &nbsp; <b>&darr;</b> / <b>S</b> brake &nbsp; <b>SPACE</b> horn</div>
   <div class="lbHead">&mdash; FASTEST RACES &mdash;</div>
   <div id="titleLeaderboard"></div>
   <div id="rotateNote">&#x21BB; Turn your phone sideways for the full screen</div>
  </div>
  <div id="endOverlay" class="overlay">
   <h2 class="lime" id="endTitle">RACE COMPLETE</h2>
   <div id="endTotal" class="lime"></div>
   <div id="endLaps"></div>
   <div id="endDelta"></div>
   <div id="endGhost"></div>
   <div id="initialsSection">
    <div class="initials-label">ENTER YOUR INITIALS</div>
    <input type="text" id="initialsInput" maxlength="3" autocomplete="off" autocapitalize="characters">
    <button class="btn" id="initialsSubmit">SUBMIT</button>
   </div>
   <div id="leaderboardSection"></div>
   <div class="btnRow"><button class="btn" id="againBtn">RACE AGAIN</button><button class="btn" id="titleBtn">TITLE</button></div>
   <div class="hint" id="againHint">ENTER / SPACE TO RACE AGAIN</div>
  </div>
 </div>
</div>
<div id="mob-overlay">
 <div id="mob-wheel-wrap"><canvas id="mob-wheel-canvas" width="140" height="140"></canvas></div>
 <div id="mob-pedals"><div class="mob-pedal" id="mob-gas">GAS</div><div class="mob-pedal" id="mob-brake">BRAKE</div></div>
</div>
<audio id="roadMusic" src="audio/roadmusic.mp3" loop preload="auto"></audio>
<audio id="truckHorn" src="audio/truckhorn.mp3" preload="auto"></audio>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="js/audio.js"></script>
<script src="js/engine.js"></script>
<script src="js/fx.js"></script>
<script src="js/game.js"></script>
<script src="js/graveyard.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
